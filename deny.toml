[graph]
targets = ["aarch64-apple-darwin"]

[advisories]
version = 2

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "BSL-1.0", "MPL-2.0"]
confidence-threshold = 0.8

[[licenses.exceptions]]
name = "whisper-rs"
version = "=0.16.0"
allow = ["Unlicense"]

[[licenses.exceptions]]
name = "whisper-rs-sys"
version = "=0.15.0"
allow = ["Unlicense"]

[[licenses.exceptions]]
name = "webpki-roots"
version = "=1.0.9"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
