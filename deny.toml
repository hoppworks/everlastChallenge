[graph]
targets = ["aarch64-apple-darwin"]

[advisories]
version = 2
# The stable toktrie_hf_tokenizers 1.9.1 adapter requires tokenizers 0.21,
# whose compile-time paste macro has no maintained semver-compatible release.
# Accept only this maintenance notice through this parent; new users or
# other advisories still fail. See docs/dependencies.md for scope and removal.
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "Compile-time paste 1.0.15 via the stable grammar adapter's tokenizers 0.21.4; no compatible fixed release" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "BSL-1.0", "MPL-2.0"]
confidence-threshold = 0.8

[[licenses.exceptions]]
name = "whisper-rs"
version = "=0.16.0"
allow = ["Unlicense"]

[[licenses.exceptions]]
name = "whisper-rs-sys"
version = "=0.15.0"
allow = ["Unlicense"]

# Grammar-engine URI resolution uses this MIT No Attribution utility. The
# original permission/disclaimer text is retained in the runtime inventory.
[[licenses.exceptions]]
name = "borrow-or-share"
version = "=0.2.4"
allow = ["MIT-0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { name = "paste", wrappers = ["tokenizers"], reason = "Only the pinned grammar adapter's tokenizer may use this unmaintained compile-time macro" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
