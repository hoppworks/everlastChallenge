[extend]
useDefault = true

[[allowlists]]
description = "Generated dependencies, binaries and isolated rule fixtures; never application source."
paths = ['''(^|/)(node_modules|target|dist|coverage|\.git)/''', '''tests/guardrails/\.generated/''', '''src-tauri/gen/''']

[[allowlists]]
description = "Upstream global-hotkey documentation uses this public keyboard chord, not an API credential."
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(^|/)vendor/global-hotkey/src/hotkey\.rs$''']
regexes = ['''^shift\+alt\+KeyQ$''']

[[allowlists]]
description = "Verified public Cargo-generated checksum metadata in the isolated dependency archive; only SHA-256-shaped values."
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(^|/)artifacts/p06-exact-state-counter-diagnostic-v1/public-dependencies/[^/]+/\.cargo-checksum\.json$''']
regexes = ['''^[a-f0-9]{64}$''']

[[allowlists]]
description = "Independently verified file SHA-256 maps in these two exact measurement/audit manifests; never application source or arbitrary metadata."
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(^|/)artifacts/p06-metal-command-buffers-v1/source-freeze\.json$''', '''(^|/)docs/verification/pre-global-completion-audit-2026-10-19\.json$''']
regexes = ['''^[a-f0-9]{64}$''']
