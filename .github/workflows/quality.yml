name: Quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    name: TypeScript, architecture and core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
          cache: npm
      - run: npm ci
      - name: Install pinned Rust tools
        run: |
          TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - run: npm run check:fast
      - run: npm run test:portable
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p dictation-core --all-targets --locked -- -D warnings
      - run: cargo test -p dictation-core --locked
      - run: npm audit --audit-level=high
      - name: Install pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan committed source for secrets
        run: '"$(go env GOPATH)/bin/gitleaks" dir --no-banner --redact --ignore-gitleaks-allow --config .gitleaks.toml .'
  # Native validation requires the qualified Apple toolchain. This job is opt-in
  # until a runner bearing these labels is registered; portable checks always run.
  native:
    name: Qualified macOS validation
    if: github.event_name == 'workflow_dispatch' && vars.EVERLAST_NATIVE_CI == 'enabled'
    runs-on: [self-hosted, macOS, ARM64, everlast-macos27]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:autonomous
      - run: npm run coverage:host
