name: Quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    name: TypeScript, architecture and core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
          cache: npm
      - run: npm ci
      - name: Install pinned Rust tools
        run: |
          TOOLCHAIN=$(node --input-type=module -e 'import fs from "node:fs"; const match = /^channel\s*=\s*"([^"\n]+)"/m.exec(fs.readFileSync("rust-toolchain.toml", "utf8")); if (!match) process.exit(1); console.log(match[1]);')
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - name: Install pinned dependency analyzer
        run: cargo install cargo-machete --version 0.9.2 --locked
      - run: npm run check:dependencies:rust
      - run: npm run check:fast
      - run: npm run test:portable
      - run: npm run test:quality
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p dictation-core --all-targets --locked -- -D warnings
      - run: cargo test -p dictation-core --locked
      - run: npm audit --audit-level=high
      - name: Install pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan publishable source and complete checkout history
        run: PATH="$(go env GOPATH)/bin:$PATH" npm run check:secrets
  # Native validation requires the qualified Apple toolchain. This job is opt-in
  # until a runner bearing these labels is registered; portable checks always run.
  native:
    name: Qualified macOS validation
    if: github.event_name == 'workflow_dispatch' && vars.EVERLAST_NATIVE_CI == 'enabled'
    runs-on: [self-hosted, macOS, ARM64, everlast-macos27]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
          cache: npm
      - run: npm ci
      - name: Install pinned dependency analyzer
        run: cargo install cargo-machete --version 0.9.2 --locked
      - run: npm run check
      - run: npm run test:autonomous
      - run: npm run coverage:host
