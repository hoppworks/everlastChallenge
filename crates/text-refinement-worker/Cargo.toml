[package]
name = "text-refinement-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-fixture = []
default = ["mlx"]
mlx = ["dep:mlxrs"]

[dependencies]
dictation-core = { path = "../dictation-core", version = "=0.2.0" }
text-refinement-protocol = { path = "../text-refinement-protocol", version = "=0.2.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = "=0.11.1"
tempfile = "=3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
mlxrs = { version = "=0.2.0", default-features = false, features = ["qwen3", "llguidance"], optional = true }

[lints]
workspace = true

[[bin]]
name = "refinement-fixture"
path = "tests/fixtures/process.rs"
required-features = ["test-fixture"]

[[test]]
name = "supervisor"
required-features = ["test-fixture"]
