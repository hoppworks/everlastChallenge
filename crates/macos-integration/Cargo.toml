[package]
name = "macos-integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
test-control = []

[dependencies]
thiserror.workspace = true
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", features = ["NSString", "NSArray", "NSData", "NSDictionary", "NSThread"] }
objc2-app-kit = { version = "=0.3.2", features = ["NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSRunningApplication", "NSWindow", "NSView", "NSGlassEffectView"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
block2 = "=0.6.2"
dispatch2 = "=0.3.1"
core-foundation = "=0.10.1"
core-graphics = "=0.25.0"
libc = "=0.2.191"
raw-window-handle = "=0.6.2"

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.11.1"

[[test]]
name = "glass_header_contract"
path = "tests/glass_header_contract.rs"
harness = false

[[test]]
name = "termination_contract"
path = "tests/termination_contract.rs"
harness = false

[[test]]
name = "native_field_evidence_contract"
path = "tests/native_field_evidence_contract.rs"
harness = false

[[test]]
name = "power_notification_contract"
path = "tests/power_notification_contract.rs"
harness = false

[[test]]
name = "native_clipboard_contract"
path = "tests/native_clipboard_contract.rs"
harness = false

[lints]
workspace = true
