[package]
name = "macos-integration"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", features = ["NSString", "NSArray", "NSData", "NSDictionary", "NSThread"] }
objc2-app-kit = { version = "=0.3.2", features = ["NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSRunningApplication", "NSWindow", "NSView", "NSGlassEffectView"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
block2 = "=0.6.2"
core-foundation = "=0.10.1"
core-graphics = "=0.25.0"
libc = "=0.2.190"
raw-window-handle = "=0.6.2"

[[test]]
name = "glass_contract"
path = "tests/glass_contract.rs"
harness = false

[[test]]
name = "glass_header_contract"
path = "tests/glass_header_contract.rs"
harness = false

[[test]]
name = "termination_contract"
path = "tests/termination_contract.rs"
harness = false

[[test]]
name = "native_preferences_contract"
path = "tests/native_preferences_contract.rs"
harness = false

[[test]]
name = "native_workspace_contract"
path = "tests/native_workspace_contract.rs"
harness = false

[lints]
workspace = true
