[package]
name = "everlast-dictation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Explicit developer-only audio injection for clocked measurement probes.
[features]
default = ["mlx-encoder-f16"]
isolated = []
measurement = []
test-control = ["macos-integration/test-control"]
mlx = ["dep:mlxrs"]
# Explicit qualification candidate; never inferred from a model filename.
mlx-encoder-f16 = ["mlx"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon", "image-png"] }
dictation-core = { path = "../crates/dictation-core", version = "=0.1.0" }
macos-integration = { path = "../crates/macos-integration", version = "=0.1.0" }
serde.workspace = true
serde_json.workspace = true
ts-rs = { version = "=11.1.0", features = ["serde-compat"] }
thiserror.workspace = true
cpal = "=0.15.3"
whisper-rs = { version = "=0.16.0", features = ["metal"] }
rtrb = "=0.3.5"
crossbeam-channel = "=0.5.17"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "blocking"] }
sha2 = { version = "=0.10.9", features = ["asm"] }
tauri-plugin-global-shortcut = "=2.4.1"
tokio = { version = "=1.53.3", features = ["rt", "time", "sync", "macros"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
mlxrs = { version = "=0.2.0", default-features = false, features = ["whisper"], optional = true }

[dev-dependencies]
tempfile = "=3.27.0"
hound = "=3.5.1"

[lints]
workspace = true

[[example]]
name = "paced_audio_probe"
required-features = ["measurement"]

[[example]]
name = "paced_runtime_probe"
required-features = ["measurement"]

[[example]]
name = "runtime_resource_probe"
required-features = ["measurement"]

[[example]]
name = "paced_reference_probe"
required-features = ["measurement"]

[[example]]
name = "observed_corpus_probe"
required-features = ["measurement"]

[[example]]
name = "engine_profile_probe"
required-features = ["measurement"]

[[example]]
name = "prefix_cache_probe"
required-features = ["measurement"]

[[example]]
name = "runtime_memory_profile"
required-features = ["mlx", "measurement"]
