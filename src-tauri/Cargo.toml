[package]
name = "everlast-dictation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Explicit developer-only audio injection for clocked measurement probes.
[features]
default = []
measurement = []

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon", "image-png"] }
dictation-core = { path = "../crates/dictation-core", version = "=0.1.0" }
macos-integration = { path = "../crates/macos-integration", version = "=0.1.0" }
serde.workspace = true
serde_json.workspace = true
ts-rs = { version = "=11.1.0", features = ["serde-compat"] }
thiserror.workspace = true
cpal = "=0.15.3"
whisper-rs = { version = "=0.16.0", features = ["metal"] }
rtrb = "=0.3.5"
crossbeam-channel = "=0.5.17"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "blocking"] }
sha2 = "=0.10.9"
tauri-plugin-global-shortcut = "=2.4.1"
tokio = { version = "=1.53.3", features = ["rt", "time", "sync", "macros"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }

[dev-dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "=3.27.0"
hound = "=3.5.1"

[lints]
workspace = true

[[example]]
name = "paced_audio_probe"
required-features = ["measurement"]
