[workspace]
members = ["crates/dictation-core", "crates/macos-integration", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.18"

[workspace.lints.rust]
unused_must_use = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
let_underscore_must_use = "deny"
allow_attributes_without_reason = "deny"
ignore_without_reason = "deny"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
