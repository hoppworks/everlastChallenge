[workspace]
members = ["crates/dictation-core", "crates/macos-integration", "crates/text-refinement-protocol", "crates/text-refinement-worker", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"

[workspace.lints.rust]
unused_must_use = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
let_underscore_must_use = "deny"
allow_attributes_without_reason = "deny"
ignore_without_reason = "deny"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

# Rust 1.93 / Xcode 27: stripping host proc-macro dylibs produces a LINKEDIT
# string pool that dyld rejects. Keep build-time libraries loadable; shipped
# application binaries retain the release stripping policy above.
[profile.release.build-override]
strip = "none"

[patch.crates-io]
global-hotkey = { path = "vendor/global-hotkey" }
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }
whisper-rs = { path = "vendor/whisper-rs" }
mlxrs = { path = "vendor/mlxrs" }
tokenizers = { path = "vendor/tokenizers" }

mlxrs-sys = { path = "vendor/mlxrs-sys" }
